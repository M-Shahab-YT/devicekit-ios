name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Toolchain info
      run: |
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        if [ -d "$SDK/System/Library/Frameworks/ScreenCaptureKit.framework" ]; then
          echo "ScreenCaptureKit IS in the iPhoneOS SDK -> native capture path enabled"
        else
          echo "ScreenCaptureKit NOT in the iPhoneOS SDK -> native capture path compiled out"
        fi

    - name: Build unsigned IPA (real device)
      run: make ipa-unsigned
      env:
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"

    - name: Upload unsigned IPA artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: devicekit-ios-unsigned-ipa
        path: build/export/*-unsigned.ipa
        retention-days: 7
