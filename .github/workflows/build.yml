name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label (e.g. macos-15, macos-26)
        required: false
        default: macos-15

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Select newest Xcode
      run: |
        ls -1 /Applications | grep -i '^Xcode' || true
        NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        if [ -n "$NEWEST" ]; then
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST"
        fi
        xcodebuild -version

    - name: Toolchain info
      run: |
        xcrun --sdk iphoneos --show-sdk-version
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        if [ -d "$SDK/System/Library/Frameworks/ScreenCaptureKit.framework" ]; then
          echo "ScreenCaptureKit IS in the iPhoneOS SDK -> native capture path enabled"
        else
          echo "ScreenCaptureKit NOT in the iPhoneOS SDK -> native capture path compiled out"
        fi

    - name: Build unsigned IPA (real device)
      run: make ipa-unsigned
      env:
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"

    - name: Upload unsigned IPA artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: devicekit-ios-unsigned-ipa
        path: build/export/*-unsigned.ipa
        retention-days: 7
